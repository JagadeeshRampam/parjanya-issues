name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to…\n2. Click…\n3. See error"
  - type: input
    id: when
    attributes:
      label: When did this happen? (date/time + timezone)
  - type: textarea
    id: context
    attributes:
      label: Browser / device / file types involved
      placeholder: e.g. Chrome on macOS, uploading .CR3 files
